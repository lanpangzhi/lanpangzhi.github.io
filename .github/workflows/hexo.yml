name: hexo
on:
  push:
    branches:
      - indigo
      - upgrade/hexo-8
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_REF: github.com/lanpangzhi/lanpangzhi.github.io
  secretId: ${{ secrets.SECRETID }}
  secretKey: ${{ secrets.SECRETKEY }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codes
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Setup pinned npm
        run: |
          npm install --global "npm@$(node -p "require('./package.json').volta.npm")"
          node -e "const expected = 'v' + require('./package.json').volta.node; if (process.version !== expected) throw new Error('Expected Node ' + expected + ', got ' + process.version)"
          node -e "const expected = require('./package.json').volta.npm; const actual = require('child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(); if (actual !== expected) throw new Error('Expected npm ' + expected + ', got ' + actual)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run check

      - name: Deploy to Tencent COS
        if: github.event_name == 'push' && github.ref == 'refs/heads/indigo'
        run: npm run deploy

      - name: Deploy github
        if: github.event_name == 'push' && github.ref == 'refs/heads/indigo'
        run: |
          cd ./public
          git init
          git config user.name "lanpangzhi"
          git config user.email "875727617@qq.com"
          git add .
          git commit -m "GitHub Actions 自动部署"
          git push --force --quiet "https://${{secrets.CI_TOKEN}}@${{env.GH_REF}}" master:master
